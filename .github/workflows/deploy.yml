name: Test Self Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  test-job:
    runs-on: self-hosted
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Auto Clean Workspace
        run: |
          Get-ChildItem -Path . -Recurse -Force | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
  
      - name: Check Docker version
        run: docker --version

      - name: Say Hello
        run: echo "Hello! GitHub Actions is running directly on F:\actions-runner"
